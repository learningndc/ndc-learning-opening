<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>NDC Learning Opening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single cinematic stage (deliberately dark, single theme) — engineering grid backdrop, scene in the middle, subtitle band and transport controls at the bottom */
:root{
  --night:#06182b;      /* deep petroleum navy ground */
  --panel:#0b2540;      /* raised surfaces */
  --line:#1d4166;       /* grid + hairlines */
  --blue:#2f86ea;       /* NDC blue */
  --sky:#8cc4ff;        /* light blue for text accents */
  --amber:#f3ad3d;      /* process-lamp amber, the single warm accent */
  --ink:#eef4fb;        /* main text */
  --mute:#9db3cc;       /* secondary text */
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#grid{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;opacity:.28;mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 78%)}
#flow{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
#flow path{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:6 14;animation:flow 6s linear infinite}
#flow path:nth-child(2){stroke:var(--amber);opacity:.5;animation-duration:9s}
@keyframes flow{to{stroke-dashoffset:-200}}

.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding-block:14px 6px}
.topbar svg{width:34px;height:34px;flex:none}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em}
.kicker{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kicker b{color:var(--amber);font-weight:500}

#stage{position:relative;z-index:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.scene{grid-area:1/1;width:100%;max-width:1120px;display:none;padding-block:8px}
.scene.on{display:block}
.a{opacity:1}
.scene.on .a{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 1s)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.scene.on .pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--d,0) * 1s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 10px}
h1,h2{font-family:var(--display);font-weight:700;line-height:.98;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(40px,7.4vw,96px)}
h2{font-size:clamp(34px,5.4vw,70px)}
h2 em,h1 em{font-style:normal;color:var(--sky)}
.lead{font-size:clamp(15px,1.6vw,19px);line-height:1.6;color:var(--mute);max-width:60ch;margin:16px 0 0}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center}
.two>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--blue);display:block}
.chip.amber i{background:var(--amber)}

/* opening */
.open{display:grid;justify-items:center;text-align:center;gap:18px}
.open .logo{width:clamp(150px,26vh,250px);height:auto}
img.logo{display:block;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px rgba(47,134,234,.18),0 18px 60px rgba(0,0,0,.45)}
.topbar img{width:34px;height:34px;border-radius:50%;flex:none}

/* cinematic opening (logo reveal) */
.opening{position:relative;display:grid;place-items:center;text-align:center;gap:22px;min-height:min(70vh,620px)}
.opening .stagebox{position:relative;width:clamp(220px,46vh,420px);aspect-ratio:1;max-width:80vw}
.opening .glow{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(47,134,234,.55) 0%,rgba(47,134,234,.12) 38%,transparent 66%);opacity:0}
.opening .rings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sky);opacity:0}
.opening .ologo{position:relative;width:100%;height:auto;opacity:0}
.opening .shine{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.opening .shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg)}
.opening .otag{font-family:var(--display);font-weight:600;font-size:clamp(16px,2.4vw,26px);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin:0;opacity:0}
.opening .otag b{color:var(--amber);font-weight:600}
.opening .loader{width:min(260px,60vw);height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.opening .loader b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber))}
.scene.on .opening .glow{animation:oglow 3.2s ease-out .2s both}
.scene.on .opening .ologo{animation:ologo 1.6s cubic-bezier(.16,.9,.3,1.15) .5s both}
.scene.on .opening .rings i{animation:oring 2.6s ease-out both}
.scene.on .opening .rings i:nth-child(1){animation-delay:1.2s}
.scene.on .opening .rings i:nth-child(2){animation-delay:1.7s}
.scene.on .opening .rings i:nth-child(3){animation-delay:2.2s}
.scene.on .opening .shine::after{animation:oshine 1.4s ease-in-out 2.4s both}
.scene.on .opening .otag{animation:otag 1.6s ease-out 3s both}
.scene.on .opening .loader b{animation:oload var(--hold,7s) linear both}
@keyframes oglow{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:.55;transform:scale(1)}}
@keyframes ologo{0%{opacity:0;transform:scale(.25) rotate(-25deg);filter:blur(14px)}70%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes oring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes oshine{from{left:-60%}to{left:130%}}
@keyframes otag{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.32em}}
@keyframes oload{to{width:100%}}
.open h1 span{display:block;font-size:.42em;letter-spacing:.24em;color:var(--mute);font-weight:600;margin-bottom:.35em}
.triad{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;font-family:var(--display);font-size:clamp(18px,2.4vw,28px);font-weight:600;color:var(--ink)}
.triad span:nth-child(2){color:var(--sky)}.triad span:nth-child(3){color:var(--amber)}
.logo .ring{stroke-dasharray:604;stroke-dashoffset:0}
.scene.on .logo .ring{animation:draw 2.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:604}}
.logo .globe{transform-origin:100px 100px}
.scene.on .logo .mer{animation:spin 8s linear infinite}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
.logo .mer{transform-origin:100px 100px}

/* about */
.target{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.target .t{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.target .big{font-family:var(--display);font-size:clamp(30px,4vw,48px);font-weight:700;margin:6px 0 18px;line-height:1}
.target .big em{font-style:normal;color:var(--amber)}
.stack{display:grid;gap:10px}
.stack div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--night);border:1px solid var(--line);font-weight:600}
.stack svg{width:22px;height:22px;flex:none;color:var(--sky)}

/* bridge */
.bridge{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:14px;align-items:center;margin-top:28px}
.bridge>*{min-width:0}
.end{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.end b{display:block;font-family:var(--display);font-size:clamp(22px,2.6vw,32px)}
.end small{color:var(--mute)}
.end.r{border-color:var(--amber)}
.pipe{position:relative;display:grid;gap:8px}
.pipe svg{width:100%;height:36px}
.pipe .pl{stroke:var(--line);stroke-width:14;stroke-linecap:round}
.pipe .pf{stroke:var(--amber);stroke-width:4;stroke-dasharray:10 12;animation:flow 2.4s linear infinite;stroke-linecap:round}
.methods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.card svg{width:34px;height:34px;color:var(--amber)}
.card b{display:block;font-family:var(--display);font-size:26px;line-height:1.05;margin:12px 0 6px}
.card p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.adj{margin-top:22px;font-family:var(--display);font-size:clamp(20px,2.6vw,30px);color:var(--sky);letter-spacing:.06em}

/* motto */
.motto{text-align:left}
.motto h1{font-size:clamp(48px,10vw,140px);line-height:.9}
.motto h1 span{display:block}
.motto h1 span:nth-child(2){color:var(--sky)}
.motto h1 span:nth-child(3){color:var(--amber)}
.motto p{font-size:clamp(16px,2vw,22px);color:var(--mute);margin-top:22px}

/* praktisi steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;position:relative}
.steps::before{content:"";position:absolute;left:12%;right:12%;top:27px;height:2px;background:linear-gradient(90deg,var(--blue),var(--amber))}
.step{text-align:center;position:relative;padding:0 6px;min-width:0}
.step .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--night);border:2px solid var(--blue);font-family:var(--mono);font-size:14px;color:var(--sky)}
.step:last-child .dot{border-color:var(--amber);color:var(--amber)}
.step b{display:block;font-size:15px}
.step small{color:var(--mute);font-size:13px}

/* bars */
.bars{display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.bar .lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.bar .lbl span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.bar .tr{height:12px;border-radius:6px;background:var(--night);overflow:hidden}
.bar .fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--sky));width:var(--w)}
.scene.on .bar .fl{animation:grow 2.4s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--d,0) * 1s)}
.bar:last-child .fl{background:linear-gradient(90deg,var(--blue),var(--amber))}
@keyframes grow{from{width:0}}
.bars .note{font-size:13px;color:var(--mute);margin:0}

/* network */
.net{width:100%;height:auto;max-height:46vh}
.net line{stroke:var(--line);stroke-width:2}
.scene.on .net line{stroke-dasharray:300;animation:drawl 1.6s ease-out both;animation-delay:calc(var(--d,0) * 1s)}
@keyframes drawl{from{stroke-dashoffset:300}}
.net circle.n{fill:var(--panel);stroke:var(--blue);stroke-width:2.5}
.net circle.p{stroke:var(--amber)}
.net text{fill:var(--ink);font-family:var(--body);font-size:13px;font-weight:600;text-anchor:middle}
.net .pulse{fill:none;stroke:var(--sky);opacity:0}
.scene.on .net .pulse{animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{opacity:.7;r:30}100%{opacity:0;r:80}}

/* program */
.prog .tag{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;padding:5px 10px;border:1px solid var(--amber);color:var(--amber);border-radius:6px;margin-bottom:14px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.area small{font-family:var(--mono);color:var(--amber);font-size:12px}
.area b{display:block;margin-top:6px;font-size:15px;line-height:1.35}
.motto2{margin-top:18px;font-family:var(--display);font-size:22px;color:var(--sky)}

/* separator sim */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.sim svg{width:100%;height:auto;display:block}
.sim text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.sim .lab{fill:var(--ink);font-size:12px}
.sim .oil{fill:#8a5a1c}.sim .wat{fill:#1f5f9e}.sim .gas{fill:#123150}
.sim .shell{fill:none;stroke:var(--sky);stroke-width:2.5}
.sim .pipe2{stroke:var(--sky);stroke-width:5;fill:none}
.sim .drop{fill:#4aa3ff}
.scene.on .sim .drop{animation:fall 2.2s ease-in infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.sim .bub{fill:none;stroke:#bcdcff;stroke-width:1.2}
.scene.on .sim .bub{animation:upb 2.6s ease-out infinite;animation-delay:calc(var(--d,0) * 1s)}
@keyframes upb{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.scene.on .sim .lvl{animation:lvl 5s ease-in-out infinite alternate}
@keyframes lvl{to{transform:translateY(-6px)}}
.simctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}
.simctl input{accent-color:var(--amber);flex:1;min-width:120px}
.simctl output{font-family:var(--mono);color:var(--amber);min-width:80px}

/* webinar */
.screen{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.screen .bar1{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:10px}
.live{background:#d9443a;color:#fff;padding:2px 8px;border-radius:4px;font-weight:500}
.scene.on .live{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.tiles{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;aspect-ratio:16/9;max-width:100%}
.tile{background:var(--night);border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.tile:first-child{grid-row:1/3;border:2px solid var(--amber)}
.tile svg{width:46%;max-width:110px;color:var(--line)}
.tile:first-child svg{color:var(--sky)}
.tile span{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--mute);font-family:var(--mono)}

/* cta */
.cta{display:grid;justify-items:center;text-align:center;gap:14px}
.cta .logo{width:clamp(110px,18vh,170px);height:auto}
.cta .q{font-size:clamp(15px,1.7vw,19px);color:var(--ink);max-width:56ch;line-height:1.55;margin:0}
.cta .sub{font-family:var(--display);font-size:clamp(22px,3vw,34px);color:var(--amber);font-weight:600}
.btn{border:0;background:var(--amber);color:#1b1206;font-weight:700;padding:13px 22px;border-radius:999px;cursor:pointer;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}

/* closing: graduates ready for work */
.cta2{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(18px,3vw,40px);align-items:center}
.cta2>*{min-width:0}
.ctxt{display:grid;gap:12px;justify-items:start}
.ctxt .logo{width:clamp(84px,13vh,130px);height:auto}
.ctxt h2{font-size:clamp(32px,4.6vw,60px)}
.ctxt .sub{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);color:var(--amber);font-weight:600;line-height:1.1}
.ctxt .q{font-size:clamp(14px,1.45vw,17px);color:var(--mute);line-height:1.55;margin:0;max-width:52ch}
.ctxt .triad{justify-content:flex-start;font-size:clamp(17px,2vw,24px)}
.ctxt .btn{padding:9px 16px;font-size:14px}
.ready{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 14px 16px;display:grid;gap:10px}
.ready svg{width:100%;height:auto;display:block}
.ready figcaption{display:flex;justify-content:center}
.ready .place{font-family:var(--mono);font-size:12px;fill:var(--mute);text-anchor:middle;letter-spacing:.12em}
.ready .route{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-dasharray:8 8;animation:flow 2s linear infinite}
.ready .arm{stroke:#4d6f96;stroke-width:6;stroke-linecap:round}
.ready .leg line{stroke:#5d7ea6;stroke-width:8;stroke-linecap:round}
.ready .leg,.ready .flame{transform-box:fill-box}
.ready .leg{transform-origin:50% 0}
.scene.on .ready .leg line{animation:none}
.scene.on .ready .leg{animation:swing .8s ease-in-out infinite alternate}
.scene.on .ready .leg.r{animation-direction:alternate-reverse}
.scene.on .ready .bob{animation:bob .4s ease-in-out infinite alternate}
.scene.on .ready .walk{animation:walkin 3.2s cubic-bezier(.2,.7,.3,1) .4s both}
.ready .flame{transform-origin:50% 100%}
.scene.on .ready .flame{animation:flick .5s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes walkin{from{transform:translateX(-120px);opacity:0}to{transform:none;opacity:1}}
@keyframes flick{from{transform:scaleY(.85) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.92)}}
.cbtn{grid-column:1/-1;display:flex;justify-content:center}
@media (max-width:820px){.cta2{grid-template-columns:1fr}}

/* captions */
.caption{position:relative;z-index:2;min-height:74px;display:grid;place-items:center;padding-block:8px}
#cap{margin:0;max-width:900px;text-align:center;font-size:clamp(15px,1.75vw,20px);line-height:1.5;background:rgba(3,12,22,.72);padding:10px 18px;border-radius:12px;border:1px solid var(--line)}
#cap:empty{display:none}
#cap .w{color:var(--mute);transition:color .15s}
#cap .w.s{color:var(--ink)}
#cap.plain .w{color:var(--ink)}

/* controls */
.controls{position:relative;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.ib.main{width:50px;height:50px;background:var(--amber);color:#1b1206;border:0}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="false"]{opacity:.45}
.track{flex:1 1 240px;display:flex;gap:4px;align-items:center;min-width:0}
.track button{flex:1;height:22px;border:0;background:none;padding:0;cursor:pointer;display:grid;align-items:center}
.track button i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.track button i b{display:block;height:100%;width:0;background:var(--amber)}
.track button.done i b{width:100%;background:var(--blue)}
.track button.cur i b{background:var(--amber)}
.count{font-family:var(--mono);font-size:12px;color:var(--mute);min-width:52px;text-align:center}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;max-width:200px}

/* start overlay */
#intro{position:absolute;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 40%,#0d2c4d 0%,var(--night) 70%);display:grid;place-items:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;overflow:auto}
#intro .in{display:grid;justify-items:center;gap:14px;max-width:640px}
#intro .logo{width:min(220px,38vh);height:auto}
#intro h1{font-size:clamp(40px,8vw,72px)}
#intro p{color:var(--mute);margin:0;line-height:1.55}
#intro .meta{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.06em}
#intro .note{font-size:13px;max-width:46ch}
.btn.go{font-size:17px;padding:15px 28px}

@media (max-width:820px){
  .two,.bridge{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr;row-gap:18px}
  .steps::before{display:none}
  .opts{width:100%}
  .lead{margin-top:10px}
  #stage{overflow-y:auto;place-items:start center}
}
@media (max-width:480px){
  .cards{gap:10px}.card{padding:14px}.card b{font-size:21px}
  .areas{grid-template-columns:1fr}
  .kicker{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *,.scene.on .a,.scene.on .pop{animation:none!important;transition:none!important}
}
</style>

<div id="app">
  <div id="grid"></div>
  <svg id="flow" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 640 C 240 600, 360 700, 620 660 S 1000 560, 1220 620"/>
    <path d="M-20 140 C 300 200, 500 90, 760 150 S 1060 230, 1220 170"/>

  </div>

/* Closing illustration: graduates walking from campus to an industrial plant */
function person(x,o){
  const skin=o.skin, body=o.body;
  let hat='',extra='',head;
  if(o.hijab){head=`<path d="M-17,-108 a17,18 0 0 1 34,0 l3,14 h-40z" fill="${o.hijab}"/><circle cy="-115" r="16" fill="${o.hijab}"/><ellipse cy="-113" rx="9.5" ry="11" fill="${skin}"/>`}
  else head=`<circle cy="-114" r="13" fill="${skin}"/><path d="M-13,-116 a13,13 0 0 1 26,0 q-13,-7 -26,0z" fill="#1d1712"/>`;
  if(o.hat==='helmet')hat=`<path d="M-15,-121 a15,14 0 0 1 30,0z" fill="var(--amber)"/><rect x="-19" y="-123" width="38" height="4" rx="2" fill="#d58f1f"/>`;
  if(o.hat==='toga')hat=`<polygon points="-20,-127 0,-135 20,-127 0,-119" fill="#11161f"/><rect x="-9" y="-126" width="18" height="7" fill="#11161f"/><path d="M18,-127 v14" stroke="var(--amber)" stroke-width="2"/><circle cx="18" cy="-112" r="2.4" fill="var(--amber)"/>`;
  if(o.vest)extra+=`<rect x="-11" y="-96" width="4" height="48" fill="var(--amber)"/><rect x="7" y="-96" width="4" height="48" fill="var(--amber)"/><rect x="-15" y="-66" width="30" height="4" fill="#d9e6f5" opacity=".8"/>`;
  if(o.coat)extra+=`<path d="M0,-98 v50" stroke="#c9d6e6" stroke-width="1.5"/><rect x="-5" y="-98" width="10" height="10" fill="#1f5f9e"/>`;
  let arm=`<line x1="14" y1="-92" x2="20" y2="-62" class="arm"/>`, item='';
  if(o.item==='diploma'){arm=`<line x1="14" y1="-92" x2="26" y2="-126" class="arm"/>`;item=`<rect x="22" y="-142" width="8" height="20" rx="3" fill="#f4efe2" transform="rotate(20 26 -132)"/><rect x="22" y="-134" width="8" height="3" fill="#d9443a" transform="rotate(20 26 -132)"/>`}
  if(o.item==='folder')item=`<rect x="16" y="-72" width="16" height="20" rx="2" fill="var(--sky)"/>`;
  if(o.item==='tablet')item=`<rect x="16" y="-74" width="14" height="19" rx="2" fill="#0b2540" stroke="var(--sky)" stroke-width="1.5"/>`;
  const len=o.gown?30:46;
  return `<g transform="translate(${x},290)"><g class="bob" style="animation-delay:${o.dl}s">
   <g class="leg"><line x1="-6" y1="-${len}" x2="-6" y2="-2" style="animation-delay:${o.dl}s"/></g>
   <g class="leg r"><line x1="6" y1="-${len}" x2="6" y2="-2" style="animation-delay:${o.dl}s"/></g>
   <rect x="-16" y="-100" width="32" height="${o.gown?72:58}" rx="12" fill="${body}"/>${extra}
   <line x1="-14" y1="-92" x2="-20" y2="-62" class="arm"/>${arm}${item}
   ${head}${hat}</g></g>`;
}

const $=id=>document.getElementById(id);
const stage=$('stage'),cap=$('cap'),track=$('track');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='scene';el.innerHTML=s.h;el.setAttribute('aria-label',s.k);stage.appendChild(el);s.el=el;
  const b=document.createElement('button');b.title=s.k;b.setAttribute('aria-label','Ke scene '+(i+1)+': '+s.k);b.innerHTML='<i><b></b></i>';
  b.onclick=()=>go(i,state.playing);track.appendChild(b);s.tick=b;
});
const pad=n=>String(n).padStart(2,'0');
const words=t=>t.split(/\s+/).length;
const est=(t,rate)=>Math.max(1600,words(t)*420/rate+500);
const total=S.reduce((a,s)=>a+(s.hold||0)+s.n.reduce((b,x)=>b+est(x.t,1)+250,0)+900,0);
$('dur').textContent=`${S.length} scene · ± ${Math.round(total/60000)} menit · narasi suara Bahasa Indonesia`;

/* ---------- voices ---------- */
const synth=window.speechSynthesis;
let voices=[],vId=null,vEn=null;
function rank(v){let r=0;if(/natural|online/i.test(v.name))r+=3;if(/google/i.test(v.name))r+=2;if(/ardi|gadis|andika|damayanti/i.test(v.name))r+=1;return r}
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices();
  const id=voices.filter(v=>/^id|^in[-_]/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a));
  const en=voices.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a));
  vEn=en[0]||null;
  const sel=$('voice'),keep=sel.value;
  sel.innerHTML='';
  const list=id.length?id:voices;
  if(!list.length){sel.innerHTML='<option value="">Suara bawaan</option>';}
  list.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name.replace(/Microsoft |Google /,'').slice(0,34)+(id.length?'':' ('+v.lang+')');sel.appendChild(o)});
  if(keep&&list.some(v=>v.name===keep))sel.value=keep;
  vId=voices.find(v=>v.name===sel.value)||id[0]||null;
  $('vnote').textContent=id.length?`Nyalakan speaker perangkat Anda. Narator: ${id[0].name.replace(/Microsoft |Google /,'')}.`
   :(voices.length?'Suara Bahasa Indonesia tidak ditemukan di browser ini; narasi memakai suara bawaan. Untuk hasil terbaik buka di Chrome atau Edge.':'Nyalakan speaker perangkat Anda. Untuk narasi terbaik gunakan Chrome atau Edge.');
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}
$('voice').onchange=()=>{vId=voices.find(v=>v.name===$('voice').value)||vId;if(state.playing){stopSpeech();speak()}};

/* ---------- audio: ambient pad + chimes (Web Audio) ---------- */
let ac=null,master=null,padNodes=[];
function initAudio(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;lp.connect(master);
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=300;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    [110,164.81,220,277.18,329.63].forEach((f,i)=>{[0,4].forEach(dt=>{const o=ac.createOscillator();o.type=i%2?'sine':'triangle';o.frequency.value=f;o.detune.value=dt;const g=ac.createGain();g.gain.value=.16/(i+1);o.connect(g);g.connect(lp);o.start();padNodes.push(o)})});
    setMusic(true);
  }catch(e){ac=null}
}
function setMusic(on){if(!ac)return;const t=ac.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(on?.05:0,t,.8)}
function openingSound(){
  if(!ac||!state.music)return;
  const t=ac.currentTime;
  // rising whoosh: filtered noise sweep
  const len=2.2,buf=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=buf.getChannelData(0);
  for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(200,t);bp.frequency.exponentialRampToValueAtTime(3200,t+1.6);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+1.3);g.gain.exponentialRampToValueAtTime(.0001,t+2.1);
  src.connect(bp);bp.connect(g);g.connect(ac.destination);src.start(t);src.stop(t+len);
  // low boom when the logo lands
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(120,t+1.5);o.frequency.exponentialRampToValueAtTime(42,t+2.6);
  og.gain.setValueAtTime(0,t+1.5);og.gain.linearRampToValueAtTime(.35,t+1.53);og.gain.exponentialRampToValueAtTime(.0001,t+3);
  o.connect(og);og.connect(ac.destination);o.start(t+1.5);o.stop(t+3.1);
  setTimeout(()=>chime(true),1550);
  setTimeout(()=>chime(false),2500);
}
function chime(big){
  if(!ac||!state.music)return;
  const t=ac.currentTime;(big?[523.25,783.99,1046.5]:[880]).forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(big?.09:.035,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+(big?2.4:.9));
    o.connect(g);g.connect(ac.destination);o.start(t+i*.12);o.stop(t+i*.12+2.6)});
}

/* ---------- player ---------- */
const state={i:0,s:0,playing:false,voice:true,music:true,rate:1,run:0};
let timers=[];
const later=(fn,ms)=>{const r=state.run;timers.push(setTimeout(()=>{if(r===state.run)fn()},ms))};
function clearT(){timers.forEach(clearTimeout);timers=[]}
function stopSpeech(){state.run++;clearT();if(synth)synth.cancel()}

function show(i){
  S.forEach((s,j)=>{s.el.classList.toggle('on',j===i);s.tick.classList.toggle('done',j<i);s.tick.classList.toggle('cur',j===i);s.tick.querySelector('b').style.width=j<i?'100%':'0'});
  const el=S[i].el;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');stage.scrollTop=0;
  $('kicker').innerHTML=`<b>${pad(i+1)}</b> · ${S[i].k}`;
  $('count').textContent=`${pad(i+1)} / ${S.length}`;
  if(S[i].hold)openingSound();else chime(i===1||i===S.length-1);
}
function setCap(t){cap.className='';if(!t){cap.innerHTML='';return}cap.innerHTML=t.split(/(\s+)/).map(w=>/\s/.test(w)?w:`<span class="w">${w}</span>`).join('')}
function mark(ch,len){
  const ws=cap.querySelectorAll('.w');let acc=0;const target=ch/len*cap.textContent.length;
  ws.forEach(w=>{if(acc<=target+1)w.classList.add('s');acc+=w.textContent.length+1});
}
function progress(){const n=S[state.i].n.length;if(!n)return;S[state.i].tick.querySelector('b').style.width=Math.round(state.s/n*100)+'%'}

function go(i,autoplay){
  stopSpeech();state.i=Math.max(0,Math.min(S.length-1,i));state.s=0;show(state.i);
  setCap(S[state.i].n[0]?S[state.i].n[0].t:'');cap.classList.add('plain');progress();
  if(autoplay){state.playing=true;later(speak,S[state.i].hold?0:900)}else{state.playing=false}
  setPlayIcon();
}
function speak(){
  if(!state.playing)return;
  const sc=S[state.i];
  if(sc.hold){ // silent cinematic opening, then continue
    const b=sc.tick.querySelector('b');b.style.transition=`width ${sc.hold}ms linear`;requestAnimationFrame(()=>b.style.width='100%');
    later(()=>{b.style.transition='';go(state.i+1,true)},sc.hold);return;
  }
  if(state.s>=sc.n.length){
    sc.tick.querySelector('b').style.width='100%';
    if(state.i<S.length-1)later(()=>go(state.i+1,true),1100);
    else{state.playing=false;setPlayIcon()}
    return;
  }
  const line=sc.n[state.s];setCap(line.t);progress();
  const nextLine=()=>{state.s++;progress();later(speak,320)};
  const say=line.say||line.t;
  if(!state.voice||!synth){cap.classList.add('plain');later(nextLine,est(line.t,state.rate));return}
  const u=new SpeechSynthesisUtterance(say);
  const v=line.en?vEn:vId;
  if(v){u.voice=v;u.lang=v.lang}else u.lang=line.en?'en-US':'id-ID';
  u.rate=state.rate*(line.en?.92:1);u.pitch=1;
  const r=state.run;let ended=false,gotB=false;
  const fin=()=>{if(ended||r!==state.run)return;ended=true;nextLine()};
  u.onend=fin;
  u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;fin()};
  u.onboundary=e=>{if(r!==state.run)return;gotB=true;mark(e.charIndex,say.length)};
  later(()=>{if(!gotB)cap.classList.add('plain')},1500);
  later(fin,est(say,state.rate)*2.6+4000); // watchdog
  synth.cancel();
  setTimeout(()=>{if(r===state.run)synth.speak(u)},60);
}
function play(){
  if(state.playing){stopSpeech();state.playing=false;setPlayIcon();return}
  if(state.i===S.length-1&&state.s>=S[state.i].n.length){go(0,true);return}
  state.playing=true;setPlayIcon();speak();
}
function setPlayIcon(){
  $('playIcon').innerHTML=state.playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  $('play').setAttribute('aria-label',state.playing?'Jeda':'Putar');
}

$('play').onclick=play;
$('prev').onclick=()=>go(state.i-1,state.playing);
$('next').onclick=()=>go(state.i+1,state.playing);
$('rate').onchange=e=>{state.rate=+e.target.value;if(state.playing){stopSpeech();speak()}};
$('voiceBtn').onclick=()=>{state.voice=!state.voice;$('voiceBtn').setAttribute('aria-pressed',state.voice);if(state.playing){stopSpeech();speak()}};
$('musicBtn').onclick=()=>{state.music=!state.music;$('musicBtn').setAttribute('aria-pressed',state.music);setMusic(state.music)};
document.addEventListener('keydown',e=>{
  if(!$('intro').hidden)return;
  if(e.target.closest('select,input'))return;
  if(e.code==='Space'){e.preventDefault();play()}
  else if(e.key==='ArrowRight')go(state.i+1,state.playing);
  else if(e.key==='ArrowLeft')go(state.i-1,state.playing);
});
document.addEventListener('click',e=>{if(e.target.closest('#replay'))go(0,true)});
$('start').onclick=()=>{
  $('intro').hidden=true;initAudio();
  if(synth){const w=new SpeechSynthesisUtterance(' ');w.volume=0;synth.speak(w)} // unlock on iOS
  go(0,true);
};

/* separator mini-simulation */
const dose=$('dose');
function sim(){
  const v=+dose.value;$('doseOut').textContent=v+' menit';
  const sepH=12+v*3.6; // water layer thickness grows with residence time
  const w=$('watR');w.setAttribute('y',182-sepH);w.setAttribute('height',sepH);
  $('sepOut').textContent=v<4?'kurang, air masih terbawa minyak':v<7?'baik':'sangat baik';
}
dose.oninput=sim;sim();

show(0);setCap('');
})();
</script>
